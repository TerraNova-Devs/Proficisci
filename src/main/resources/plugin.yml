name: Proficisci
version: 1.0.0
main: de.mcterranova.proficisci.Proficisci
api-version: '${minecraftVersion}'
authors: [Bastizeit, gerryxn]
prefix: TerraNova
website: mcterranova.de
description: Plugin dedicated to voyage.
commands:
  ship:
    description: Manage ships
    usage: /ship <list|tp|name|view>
    permission: proficisci.admin
    permission-message: You do not have permission to use this command.
  watermap:
    description: Render the water map around 0/0
    usage: /watermap
    permission: proficisci.admin
    permission-message: You do not have permission to use this command.
depend: [Nexo, Nations, TerranovaLib, WorldGuard]
softdepend: [HeroicMap]
permissions:
  proficisci.admin:
    description: Ship commands, and placing and breaking every ship block regardless of town and rank.
    default: op
